# spell: disable

name: app
description: "Rick and Morty App"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  cupertino_icons: ^1.0.8
  get_it: ^9.2.1
  injectable: ^3.0.0
  rxdart: ^0.28.0
  go_router: ^18.0.0
  equatable: ^2.0.7
  flutter_bloc: ^9.1.1
  dio: ^5.9.0
  retrofit: ^4.7.3

  core:
    path: ../packages/core

  json_annotation: ^4.12.0
  connectivity_plus: ^7.3.2
  flutter_cache_manager: ^3.4.5
  cached_network_image: ^4.0.4

dev_dependencies:
  analysis_options:
    path: ../packages/analysis_options
  
  flutter_test:
    sdk: flutter

  flutter_flavorizr: ^2.5.0
  flutter_launcher_icons: ^0.14.4
  injectable_generator: ^3.1.3
  build_runner: ^2.16.0
  retrofit_generator: ^10.2.10
  json_serializable: ^6.11.1
  file: ^7.0.1
  
flutter:
  generate: true
  uses-material-design: true

