# flutter pub run flutter_launcher_icons
# cspell: disable

flutter_launcher_icons:
  ios: true
  image_path_ios: "assets/app_icons/stage/app_icon_ios_stage.png"
  image_path_ios_dark_transparent: "assets/app_icons/stage/app_icon_ios_dark_stage.png"
  image_path_ios_tinted_grayscale: "assets/app_icons/stage/app_icon_ios_tinted_stage.png"
  desaturate_tinted_to_grayscale_ios: true
  remove_alpha_ios: true

  android: "ic_launcher"
  image_path_android: "assets/app_icons/stage/app_icon_android_legacy_stage.png"
  adaptive_icon_monochrome: "assets/app_icons/stage/app_icon_android_mono_stage.png"
  adaptive_icon_foreground: "assets/app_icons/stage/app_icon_android_adaptive_stage.png" # only available for Android 8.0 devices and above
  adaptive_icon_background: "#FFFFFF" # only available for Android 8.0 devices and above
  adaptive_icon_foreground_inset: 0 # only available for Android 8.0 devices and above
  min_sdk_android: 23
